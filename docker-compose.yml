version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: weather_redis
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: weather_backend
    ports:
      - '3001:3001'
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: weather_frontend
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: weather_network
